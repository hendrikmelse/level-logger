# The level-logger app. Its image is built and pushed by CI (.github/workflows);
# deploy.sh sets IMAGE to the commit being deployed.
services:
  api:
    image: ${IMAGE:?set IMAGE, e.g. by running deploy.sh}
    container_name: level-logger-api
    restart: unless-stopped
    env_file: .env # DATABASE_URL (see .env.example)
    environment:
      NODE_ENV: production
      # Safe because the only way to reach this container is through Caddy on
      # the internal network; never publish its port.
      TRUST_PROXY: "true"
    networks:
      - web # reached by Caddy
      - db # reaches Postgres
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Logs go to the host's journal, which outlives the container. Read them with:
    #   sudo journalctl -t level-logger-api
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

networks:
  web:
    external: true
    name: web
  db:
    external: true
    name: db
