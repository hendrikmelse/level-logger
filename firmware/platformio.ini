; ESP32-C3 Super Mini firmware: samples an analog level sensor and posts batches to the ingest API.
[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; The Super Mini has native USB, no serial chip: route Serial over USB CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
